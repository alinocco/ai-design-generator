[project]
name = "ai-design-generator"
version = "0.1.0"
description = "Многоагентный AI-генератор дизайн-проекта квартиры (курсовой проект по МАС)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
recognition = [
    "opencv-python-headless>=4.9",
    "rapidocr-onnxruntime>=1.3",
    "scikit-image>=0.22",
    "numpy>=1.26",
]

[project.scripts]
aidesign = "aidesign.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidesign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
